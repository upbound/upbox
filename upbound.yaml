apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: configuration-upbox
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: xpkg.upbound.io/upbound/configuration-aws-network
    version: v0.24.0
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.upbound.io/upbound/provider-aws-ec2
    version: v1
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.upbound.io/crossplane-contrib/function-auto-ready
    version: '>=v0.3.0'
  description: Upbox is a solution for providing automated cloud lab environments
    for 3rd Party Developers and Training Attendees.
  license: Apache-2.0
  maintainer: Upbound <support@upbound.io>
  readme: |
    # Upbox

    Upbox is a solution for providing automated cloud lab environments for 3rd Party Developers and Training Attendees.

    ## Prerequisites

    - AWS Provider Configuration
    - XNetwork resource (provides VPC, subnet, and security group infrastructure)

    ## Quick Start

    1. Set up the network infrastructure:
       ```bash
       kubectl apply -f examples/configuration-aws-network.yaml
       kubectl apply -f examples/xnetwork.yaml
       ```

    2. Create an UpboxSet (for training sessions) or individual Upboxes:
       ```bash
       # For a training session with multiple participants
       kubectl apply -f examples/upboxset/example.yaml

       # For an individual lab environment
       kubectl apply -f examples/upbox/example.yaml
       ```
  repository: xpkg.upbound.io/upbound/configuration-upbox
  source: github.com/upbound/upbox

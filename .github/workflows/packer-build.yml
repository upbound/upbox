name: Build AMI with Packer prod

on:
  push:
    branches: [ main ]
    paths:
      - 'packer/**'
      - '.github/workflows/packer-*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ami-id: ${{ steps.ami.outputs.ami-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.1
        with:
          role-to-assume: arn:aws:iam::418295723810:role/upbox-packer-role
          aws-region: us-west-2

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: '1.12.0'

      - name: Install Packer Plugins
        run: |
          packer plugins install github.com/hashicorp/amazon

      - name: Validate Packer Template
        run: |
          cd packer
          packer validate upbox.pkr.hcl

      - name: Build AMI
        env:
          PKR_VAR_ami_users: '["609897127049"]'
        run: |
          cd packer
          packer build upbox.pkr.hcl

      - name: Extract and Output AMI IDs
        run: |
          cd packer
          echo "### 🎉 AMI Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract all AMI IDs and their regions
          LAST_RUN_ID=$(cat manifest.json | jq -r .last_run_uuid)
          cat manifest.json | jq -r ".builds[] | select(.packer_run_uuid == \"$LAST_RUN_ID\") | .artifact_id | split(\",\") | .[] | split(\":\") | \"\(.[0]): \(.[1])\"" >> $GITHUB_STEP_SUMMARY
        id: ami
